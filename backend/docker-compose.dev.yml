# Local development only (production runs everything on the VPS without Docker, DEPLOYMENT.md).
# To run the frontend too, use the root compose.yaml (`docker compose up --build` from the repo root): it includes
# this file. The commands below run the backend alone, from backend/.
#   docker compose -f docker-compose.dev.yml up -d --build            # whole backend: Postgres, Redis, Mailpit, Django, Celery
#   docker compose -f docker-compose.dev.yml up -d db redis mailpit   # only the services, to run Django with uv
# Settings come from backend/.env (Compose reads it automatically). Inside the containers DB_HOST and REDIS_URL
# point at the db and redis services instead of 127.0.0.1, and EMAIL_HOST at mailpit; load_dotenv() never overrides them.

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: noore-backend-dev
  env_file: .env
  environment:
    # Requests forwarded by the Next.js container (root compose.yaml) arrive with Host "web".
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    WEASYPRINT_DLL_DIRECTORIES: ""   # Windows-only setting; the image has Pango installed
    # Admin saves refresh the Next.js cache (core/revalidate.py). The secret only works inside this Docker network
    # and on 127.0.0.1, so a fixed value is fine here; production uses a real one from .env (DEPLOYMENT.md).
    FRONTEND_INTERNAL_URL: http://frontend:3000
    REVALIDATE_SECRET: local-docker-only
  volumes:
    - .:/app/backend
    # `manage.py seed` reads the frontend's mock fixtures (settings.SEED_FIXTURES_DIR)
    - ../frontend/src/mocks/fixtures:/app/frontend/src/mocks/fixtures:ro
    - ../frontend/public:/app/frontend/public:ro   # sample PDFs the fixtures link to (/samples/…)
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    mailpit:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-noore}
      POSTGRES_USER: ${DB_USER:-noore}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # Catches every email sent in development; read them at http://127.0.0.1:8025 (nothing reaches a real inbox).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web inbox

  # Django on http://127.0.0.1:8000 (the Next.js dev server forwards /api/, /admin/, /r/ and /media/ to it).
  # On the first start it also loads the frontend fixtures and their photos (seed --if-empty skips that later).
  web:
    <<: *backend
    command: >-
      sh -c "uv run python manage.py migrate
      && uv run python manage.py seed --if-empty
      && uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"

  # Celery worker + beat in one process (dev only). It does not reload on code changes: restart it.
  worker:
    <<: *backend
    command: uv run celery -A config worker -B -l info -s /tmp/celerybeat-schedule

volumes:
  pgdata:
    name: backend_pgdata   # fixed name: the same database whether started from backend/ or from the root
