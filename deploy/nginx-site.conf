# Nginx site for this project when Nginx already runs on the VPS for another site (PROXY=nginx, DEPLOYMENT.md).
# It only adds THIS domain; the other sites are not touched. Install:
#   sed "s/DOMAIN/noore-sadakah.example.com/g" deploy/nginx-site.conf > /etc/nginx/sites-available/noore-sadaqah
#   ln -s /etc/nginx/sites-available/noore-sadaqah /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d noore-sadakah.example.com      (adds HTTPS to this file)
# A main domain (nooresadaqah.org) also wants its www.: add "www.DOMAIN" to server_name and "-d www.<domain>" to certbot.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append, so a visitor can't fake their IP (SECURITY.md).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
