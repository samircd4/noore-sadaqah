name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No backend exists yet: build and test against the mock API (docs/ARCHITECTURE.md "API modes").
      API_MODE: mock
      ALLOW_MOCK_IN_PRODUCTION: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Same message keys in bn and en
        run: npm run i18n:check

      - name: Palette only (no raw hex, no blue/yellow/gray)
        run: npm run check:palette

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
